<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>MIX Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: #1a1a2e;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: #e0e0e0;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(0, 210, 255, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 50%, rgba(123, 47, 247, 0.08) 0%, transparent 50%);
      pointer-events: none;
    }
    .logo-container { position: relative; margin-bottom: 40px; }
    .logo {
      font-size: 52px; font-weight: 700; letter-spacing: 10px;
      background: linear-gradient(135deg, #00d2ff 0%, #7b2ff7 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .logo-sub {
      font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
      color: #6060a0; margin-top: 6px; text-align: center;
    }
    .status {
      font-size: 13px; color: #8080b0;
      min-height: 20px;
      transition: opacity 0.3s;
    }
    .progress-track {
      margin-top: 20px;
      width: 200px; height: 3px;
      background: rgba(123, 47, 247, 0.15);
      border-radius: 2px; overflow: hidden;
    }
    .progress-bar {
      width: 30%; height: 100%;
      background: linear-gradient(90deg, #00d2ff, #7b2ff7);
      border-radius: 2px;
      animation: progress 2s ease-in-out infinite;
    }
    @keyframes progress {
      0% { width: 10%; margin-left: 0; }
      50% { width: 50%; margin-left: 25%; }
      100% { width: 10%; margin-left: 90%; }
    }
    .error {
      color: #ff6b6b; font-size: 13px;
      max-width: 360px; text-align: center;
      margin-top: 16px; line-height: 1.4;
    }
    .version {
      position: absolute; bottom: 16px;
      font-size: 11px; color: #404060;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <div class="logo">MIX</div>
    <div class="logo-sub">Unified AI Agent Platform</div>
  </div>
  <div class="status" id="status">Starting services...</div>
  <div class="progress-track"><div class="progress-bar"></div></div>
  <div class="error" id="error" style="display:none"></div>
  <div class="version">v0.1.0</div>
</body>
</html>
