<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>MIX Agent</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 100vw; height: 100vh; overflow: hidden;
      background: #1a1a2e;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: #e0e0e0;
    }
    .logo {
      font-size: 48px; font-weight: 700; letter-spacing: 8px;
      background: linear-gradient(135deg, #00d2ff, #7b2ff7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 32px;
    }
    .status {
      font-size: 14px; color: #a0a0c0;
      min-height: 20px;
      transition: opacity 0.3s;
    }
    .spinner {
      margin-top: 24px;
      width: 32px; height: 32px;
      border: 3px solid rgba(123, 47, 247, 0.2);
      border-top-color: #7b2ff7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error {
      color: #ff6b6b; font-size: 13px;
      max-width: 360px; text-align: center;
      margin-top: 16px; line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="logo">MIX</div>
  <div class="status" id="status">Starting services...</div>
  <div class="spinner" id="spinner"></div>
  <div class="error" id="error" style="display:none"></div>
</body>
</html>
