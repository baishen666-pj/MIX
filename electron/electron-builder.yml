appId: com.mix.desktop
productName: MIX Agent
publish:
  provider: github
  owner: baishen666-pj
  repo: MIX
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - "!src/**/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{tsconfig.json,eslint.config.*,README.md}"
asarUnpack:
  - "**/*.node"
extraResources:
  - from: ../dist/mix-engine
    to: engine
    filter:
      - "**/*"
  - from: ../gateway/bundle
    to: gateway
    filter:
      - "**/*"
  - from: resources/splash.html
    to: splash.html
  - from: build/icon-16.png
    to: tray-icon.png
win:
  executableName: mix-agent
  target:
    - nsis
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: true
  perMachine: false
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  artifactName: ${name}-${version}-mac.${ext}
  target:
    - dmg
linux:
  icon: build/icon-512.png
  target:
    - AppImage
    - deb
  category: Utility
  synopsis: Unified AI agent platform
  artifactName: ${name}-${version}-linux.${ext}
npmRebuild: false
