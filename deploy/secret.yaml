# IMPORTANT: Replace ALL placeholder values before deploying.
#   kubectl create secret generic mix-secret \
#     --from-literal=MIX_LLM_API_KEY=<your-key> \
#     --from-literal=OPENAI_API_KEY=<your-key> \
#     --from-literal=ENGINE_API_KEY=<random-secret> \
#     --from-literal=API_KEYS=<comma-separated-keys> \
#     -n mix-system --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: mix-secret
  namespace: mix-system
  labels:
    app.kubernetes.io/name: mix
    app.kubernetes.io/part-of: mix-platform
type: Opaque
stringData:
  MIX_LLM_API_KEY: "REPLACE_WITH_YOUR_LLM_API_KEY"
  OPENAI_API_KEY: "REPLACE_WITH_YOUR_OPENAI_API_KEY"
  ENGINE_API_KEY: "REPLACE_WITH_A_RANDOM_SECRET"
  API_KEYS: "REPLACE_WITH_COMMA_SEPARATED_KEYS"
