apiVersion: apps/v1
kind: Deployment
metadata:
  name: mix-web
  namespace: mix-system
  labels:
    app.kubernetes.io/name: mix-web
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: mix-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mix-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mix-web
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: mix-platform
      annotations:
        kubectl.kubernetes.io/default-container: web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: web
          image: mix-web:latest
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
