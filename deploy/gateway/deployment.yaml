apiVersion: apps/v1
kind: Deployment
metadata:
  name: mix-gateway
  namespace: mix-system
  labels:
    app.kubernetes.io/name: mix-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: mix-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: mix-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mix-gateway
        app.kubernetes.io/component: gateway
        app.kubernetes.io/part-of: mix-platform
      annotations:
        kubectl.kubernetes.io/default-container: gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: gateway
          image: mix-gateway:latest
          ports:
            - name: http
              containerPort: 18789
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mix-config
            - secretRef:
                name: mix-secret
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
