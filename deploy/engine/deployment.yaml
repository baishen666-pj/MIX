apiVersion: apps/v1
kind: Deployment
metadata:
  name: mix-engine
  namespace: mix-system
  labels:
    app.kubernetes.io/name: mix-engine
    app.kubernetes.io/component: engine
    app.kubernetes.io/part-of: mix-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mix-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mix-engine
        app.kubernetes.io/component: engine
        app.kubernetes.io/part-of: mix-platform
      annotations:
        kubectl.kubernetes.io/default-container: engine
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: engine
          image: mix-engine:latest
          ports:
            - name: http
              containerPort: 18700
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mix-config
            - secretRef:
                name: mix-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          emptyDir: {}
