name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --tb=short -q

  test-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npx vitest run --project mix-gateway

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: cd web && npm ci
      - name: Run tests
        run: cd web && npx vitest run
      - name: Build
        run: cd web && npx vite build

  docker-build:
    runs-on: ubuntu-latest
    needs: [test-engine, test-gateway, test-web]
    steps:
      - uses: actions/checkout@v4
      - name: Build engine image
        run: docker build -f Dockerfile.engine -t mix-engine .
      - name: Build gateway image
        run: docker build -f Dockerfile.gateway -t mix-gateway .
      - name: Build web image
        run: docker build -f Dockerfile.web -t mix-web .
